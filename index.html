<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Nueva Vida</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-responsive.css" />
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <!-- Nota: no cargamos aquí el script del parser roto -->
</head>
<body>
  <div class="container">
    <img src="logo-nueva-vida.png" alt="Logo" class="logo" />

    <h1>RADIO NUEVA VIDA</h1>
    <p class="subtitulo">radio cristiana online</p>


    <button id="playPauseBtn" class="play-button" aria-label="Reproducir/Pausar">
      <svg id="iconoPlay" viewBox="0 0 64 64" width="48" height="48" fill="white">
        <polygon points="24,18 48,32 24,46" />
      </svg>
      <svg id="iconoPause" viewBox="0 0 64 64" width="48" height="48" fill="white" style="display: none;">
        <rect x="22" y="18" width="8" height="28" />
        <rect x="36" y="18" width="8" height="28" />
      </svg>
    </button>

    <img id="cover" class="cover" src="coversgospelgeneric.png" alt="Carátula del álbum" />

    <p id="artist">Cargando artista...</p>
    <p id="title">Cargando canción...</p>

    <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="1" />

    <div class="ondas-container">
      <img src="ondas-animadas.svg" alt="Ondas animadas" class="ondas-svg" />
    </div>

    <div class="icons">
      <!-- Enlaces oficiales ArgentinaStream / SonicPanel (descargan el formato correcto) -->
      <a href="https://usa15.fastcast4u.com/tunein/estaciononline.pls" download><img src="icon-winamp.png" alt="Winamp"></a>
      <a href="https://usa15.fastcast4u.com/tunein/estaciononline.asx" download><img src="icon-wmp.png" alt="Windows Media Player"></a>
      <a href="https://usa15.fastcast4u.com/tunein/estaciononline.qtl" download><img src="quicktime-icon.png" alt="Quick Time"></a>
      <a href="aquí url stream vlc" download><img src="icon-vlc.png" alt="VLC"></a>
      <a href="https://usa16.fastcast4u.com/proxy/estaciononline?mp=/1"><img src="icon-externo.png" alt="Abrir en reproductor externo"></a>
    </div>

    <!-- audio: URL del stream actualizada -->
    <audio id="audio" src="https://usa16.fastcast4u.com/proxy/estaciononline?mp=/1" preload="none"></audio>

  </div>

  <!-- ACCESO FLOTANTE AL QR DE PEDIDOS MUSICALES -->
  <div class="qr-pedidos" id="acceso-pedidos">
    <button type="button" id="abrir-qr-pedidos" aria-label="Mostrar código QR para pedidos musicales" title="Escanear para pedir canciones">
      <img src="qr-pedidos-musical.png" alt="Mostrar código QR de pedidos musicales" loading="lazy">
    </button>
    <p>Escaneá el QR para pedir una canción o <a href="./pedido-musical.html" id="enlace-formulario-pedidos">abrí el formulario aquí</a>.</p>
  </div>
  <div class="qr-modal" id="modal-qr-pedidos" aria-hidden="true">
    <div class="qr-modal-contenido" role="dialog" aria-modal="true" aria-labelledby="titulo-qr-pedidos">
      <button type="button" class="qr-modal-cerrar" id="cerrar-qr-pedidos" aria-label="Cerrar">×</button>
      <h2 id="titulo-qr-pedidos">Pedidos musicales</h2>
      <img src="qr-pedidos-musical.png" alt="Código QR para abrir el formulario de pedidos">
      <p>Escaneá este código con la cámara de tu celular.</p>
      <a href="./pedido-musical.html" id="abrir-formulario-pedidos">O abrí el formulario aquí</a>
    </div>
  </div>

  <!-- ICONO FLOTANTE DE CONTACTO (usa una imagen pequeña para integrar) -->
  <!-- Asegurate de subir 'icon-contacto.png' en la raíz o ajustar la ruta -->
  <div id="btn-contacto" class="boton-contacto">
  <img src="icono-contacto.png" alt="Contacto">
</div>

  <!-- MODAL DE CONTACTO -->
  <div id="modal-contacto" class="modal oculto">
    <div class="modal-contenido">
      <span id="cerrar-modal" class="cerrar">&times;</span>
      <h2>📨 Contáctanos</h2>
      <form id="formulario-contacto">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez" required>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="ejemplo@email.com" required>

        <label for="mensaje">Tu mensaje</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escríbenos tu consulta o propuesta..." rows="4" required></textarea>

        <button type="submit">Enviar mensaje ✉️</button>
      </form>
    </div>
  </div>

  <!-- ESTILOS DEL MODAL Y BOTÓN (mantengo tus estilos inline como estaban) -->
  <style>
    .qr-pedidos {
      position: fixed;
      bottom: 25px;
      left: 25px;
      z-index: 9999;
      width: 74px;
      text-align: center;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .qr-pedidos > button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 69px;
      height: 69px;
      margin: 0;
      padding: 7px;
      border: 3px solid #204a57;
      border-radius: 50%;
      background: #204a57;
      box-shadow: 0 0 0 3px #2f6775, 0 4px 15px rgba(0,0,0,.3);
      cursor: pointer;
      transition: transform .2s ease, background-color .2s ease, box-shadow .2s ease;
    }
    .qr-pedidos > button:hover {
      background: #2f6775;
      transform: scale(1.06);
      box-shadow: 0 0 0 3px #204a57, 0 0 0 6px #2f6775, 0 6px 18px rgba(0,0,0,.35);
    }
    .qr-pedidos > button img {
      display: block;
      width: 57px;
      height: 57px;
      object-fit: contain;
      border-radius: 50%;
    }
    .qr-pedidos p {
      display: none;
      position: absolute;
      left: 0;
      bottom: 62px;
      width: 190px;
      margin: 0;
      padding: 9px 11px;
      border-radius: 8px;
      background: #002b36;
      color: #fff;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 3px 12px rgba(0,0,0,.3);
    }
    .qr-pedidos:focus-within p, .qr-pedidos:hover p { display: block; }
    .qr-pedidos p a { color: #ffd166; font-weight: 700; }
    .qr-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10001;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0,0,0,.72);
    }
    .qr-modal.abierto { display: flex; }
    .qr-modal-contenido {
      position: relative;
      width: min(92vw, 340px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      padding: 22px 18px 20px;
      border-radius: 18px;
      background: #002b36;
      color: #fff;
      text-align: center;
      box-shadow: 0 12px 36px rgba(0,0,0,.45);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .qr-modal-contenido h2 {
      margin: 4px 26px 14px;
      color: #ffd166;
      font-size: 20px;
    }
    .qr-modal-contenido > img {
      display: block;
      width: min(68vw, 240px);
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      margin: 0 auto 12px;
      padding: 8px;
      background: #fff;
      border-radius: 10px;
      image-rendering: auto;
    }
    .qr-modal-contenido p { margin: 8px 0 12px; font-size: 14px; line-height: 1.4; }
    .qr-modal-contenido > a { color: #ffd166; font-weight: 700; }
    .qr-modal-cerrar {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 34px;
      height: 34px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #204a57;
      color: #fff;
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
    }
    @media (max-width: 480px) {
      .qr-pedidos { bottom: 25px; left: 25px; }
      .qr-modal-contenido { width: min(92vw, 340px); padding: 20px 16px 18px; }
      .qr-modal-contenido > img { width: min(66vw, 220px); }
    }

    .boton-contacto {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background-color: #204a57; /* azul petróleo, combina con tu fondo */
      color: #ffffff;
      font-weight: 600;
      border: none;
      padding: 10px;
      font-size: 15px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      z-index: 9999;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boton-contacto img { display: block; }

    .boton-contacto:hover {
      background-color: #2f6775;
      transform: scale(1.06);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }

    .modal {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 9998;
    }
    .modal.oculto {
      display: none;
    }
    .modal-contenido {
      background-color: #002b36;
      padding: 2rem;
      border-radius: 16px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .cerrar {
      float: right;
      font-size: 26px;
      font-weight: bold;
      color: #ffd166;
      cursor: pointer;
    }
    .modal-contenido h2 {
      margin-bottom: 1rem;
      color: #ffd166;
      text-align: center;
    }
    form label { display: block; margin: 12px 0 6px; font-size: 0.95rem; }
    form input, form textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      background: #f8f8f8;
      color: #000;
    }
    form button[type="submit"] {
      margin-top: 20px;
      width: 100%;
      background-color: #204a57;
      color: white;
      padding: 12px;
      border: none;
      font-size: 1rem;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    form button[type="submit"]:hover {
      background-color: #2f6775;
    }
  </style>

  <!-- SCRIPT DEL MODAL (igual que antes, ahora apuntando al id btn-contacto) -->
  <script>
    const btnContacto = document.getElementById("btn-contacto");
    const modal = document.getElementById("modal-contacto");
    const cerrarModal = document.getElementById("cerrar-modal");
    const formulario = document.getElementById("formulario-contacto");

    btnContacto.onclick = () => modal.classList.remove("oculto");
    cerrarModal.onclick = () => modal.classList.add("oculto");
    window.onclick = (e) => { if (e.target === modal) modal.classList.add("oculto"); }
    formulario.onsubmit = (e) => {
      e.preventDefault();
      alert("✅ Gracias por escribirnos. Pronto te responderemos.");
      modal.classList.add("oculto");
      formulario.reset();
    }
  </script>

  <script>
    const modalQrPedidos = document.getElementById("modal-qr-pedidos");
    const abrirQrPedidos = document.getElementById("abrir-qr-pedidos");
    const cerrarQrPedidos = document.getElementById("cerrar-qr-pedidos");

    function mostrarQrPedidos() {
      modalQrPedidos.classList.add("abierto");
      modalQrPedidos.setAttribute("aria-hidden", "false");
      cerrarQrPedidos.focus();
    }
    function ocultarQrPedidos() {
      modalQrPedidos.classList.remove("abierto");
      modalQrPedidos.setAttribute("aria-hidden", "true");
      abrirQrPedidos.focus();
    }
    abrirQrPedidos.addEventListener("click", mostrarQrPedidos);
    cerrarQrPedidos.addEventListener("click", ocultarQrPedidos);
    modalQrPedidos.addEventListener("click", function(e) {
      if (e.target === modalQrPedidos) ocultarQrPedidos();
    });
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape" && modalQrPedidos.classList.contains("abierto")) ocultarQrPedidos();
    });

    function abrirVentanaFormulario(e) {
      e.preventDefault();
      const url = new URL("./pedido-musical.html", window.location.href).href;
      const popup = window.open(url, "pedidoMusicalRadioNuevaVida",
        "popup=yes,width=420,height=720,resizable=yes,scrollbars=yes");
      // Si el navegador bloquea ventanas emergentes, abrimos en la pestaña actual.
      if (!popup) window.location.href = url;
    }
    document.getElementById("enlace-formulario-pedidos").addEventListener("click", abrirVentanaFormulario);
    document.getElementById("abrir-formulario-pedidos").addEventListener("click", abrirVentanaFormulario);
  </script>

</body>
