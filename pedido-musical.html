<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#002b33">
  <title>Pedido musical | Radio Nueva Vida</title>
  <style>
    :root {
      color-scheme: dark;
      --fondo: #002b33;
      --amarillo: #ffca28;
      --campo: #f7f7f7;
      --boton: #204a57;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--fondo);
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .pedido {
      width: 100%;
      max-width: 500px;
      padding: 16px 14px 28px;
    }

    .encabezado {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 28px;
      margin: 0 28px 14px;
    }

    .encabezado h1 {
      margin: 0;
      color: var(--amarillo);
      font-size: 20px;
      line-height: 1.2;
      font-weight: 800;
      text-align: center;
    }

    .sobre { font-size: 19px; }

    .volver {
      position: absolute;
      top: -8px;
      right: -27px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 28px;
      height: 28px;
      color: var(--amarillo);
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
    }

    .campo { margin-bottom: 15px; }
    .campo-trampa {
      position: absolute !important;
      left: -10000px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }
    button:disabled { opacity: .7; cursor: wait; }

    label {
      display: block;
      margin: 0 0 6px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
    }

    input, textarea {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 10px 12px;
      background: var(--campo);
      color: #202020;
      font: inherit;
      font-size: 14px;
      outline: none;
    }

    input { min-height: 39px; }

    input::placeholder, textarea::placeholder {
      color: #858585;
      opacity: 1;
      font-weight: 600;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
      line-height: 1.4;
    }

    input:focus, textarea:focus {
      box-shadow: 0 0 0 2px var(--amarillo);
    }

    button {
      width: 100%;
      min-height: 46px;
      margin-top: 8px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: var(--boton);
      color: #fff;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    button:focus-visible, .volver:focus-visible {
      outline: 2px solid var(--amarillo);
      outline-offset: 3px;
    }

    .aviso {
      margin: 12px 2px 0;
      color: #ffe5a0;
      text-align: center;
      font-size: 13px;
      line-height: 1.4;
    }

    @media (max-width: 360px) {
      .pedido { padding: 14px 12px 24px; }
      .encabezado h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="pedido">
    <header class="encabezado">
      <span class="sobre" aria-hidden="true">📩</span>
      <h1>PEDIDO MUSICAL</h1>
      <a class="volver" href="./index.html" aria-label="Volver a Radio Nueva Vida" title="Volver">×</a>
    </header>

    <form id="formulario-pedido">

      <div class="campo campo-trampa" aria-hidden="true">
        <label for="web_extra">No completar este campo</label>
        <input id="web_extra" name="web_extra" type="text" tabindex="-1" autocomplete="off">
      </div>
      <div class="campo">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" placeholder="Ej: Juan Pérez" autocomplete="name" required>
      </div>

      <div class="campo">
        <input id="cancion" name="cancion" type="text" placeholder="Artista - Nombre Canción" aria-label="Artista y nombre de la canción" required>
      </div>

      <div class="campo">
        <input id="ubicacion" name="ubicacion" type="text" placeholder="País - Ciudad" aria-label="País y ciudad" autocomplete="country-name" required>
      </div>

      <div class="campo">
        <label for="mensaje">Tu mensaje</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escríbenos tu mensaje y saludos a familiares y amigos..." rows="4"></textarea>
      </div>

      <button type="submit">Enviar Pedido ✉️</button>
      <p class="aviso" id="estado" role="status" aria-live="polite">Completa tu pedido y envíalo a Radio Nueva Vida.</p>
    </form>
  </main>

  <script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzUIiU_Ro6-xvoAxs57S2XVo_XVGU9czcMpz6YV3IFM5KUoZhLsdwXymwXD3-Ibuys/exec";
    const formularioPedido = document.getElementById("formulario-pedido");
    const botonEnviar = formularioPedido.querySelector('button[type="submit"]');
    const estado = document.getElementById("estado");

    formularioPedido.addEventListener("submit", async function (event) {
      event.preventDefault();

      // Campos trampa: los bots suelen completar campos ocultos.
      const webExtra = document.getElementById("web_extra");
      if (webExtra && webExtra.value.trim() !== "") return;

      const pedido = {
        nombre: document.getElementById("nombre").value.trim(),
        cancion: document.getElementById("cancion").value.trim(),
        ubicacion: document.getElementById("ubicacion").value.trim(),
        mensaje: document.getElementById("mensaje").value.trim(),
        web_extra: ""
      };

      if (!pedido.nombre || !pedido.cancion) {
        estado.textContent = "Por favor, completa tu nombre y la canción que deseas pedir.";
        return;
      }

      botonEnviar.disabled = true;
      botonEnviar.textContent = "Enviando pedido...";
      estado.textContent = "Estamos enviando tu pedido. Espera un momento.";

      try {
        // text/plain evita la solicitud CORS preflight. En modo no-cors
        // el navegador oculta la respuesta, por eso no puede confirmar el guardado.
        await fetch(URL_APPS_SCRIPT, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify(pedido)
        });

        formularioPedido.reset();
        estado.textContent = "Solicitud enviada. ¡Gracias por compartir tu pedido musical! Si no aparece en la hoja, revisa la implementación de Apps Script.";
      } catch (error) {
        console.error("Error al enviar el pedido:", error);
        estado.textContent = "No se pudo enviar el pedido. Comprueba tu conexión e inténtalo nuevamente.";
      } finally {
        botonEnviar.disabled = false;
        botonEnviar.textContent = "Enviar Pedido ✉️";
      }
    });
  </script>
</body>
</html>
